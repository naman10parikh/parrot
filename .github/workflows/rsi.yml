name: parrot RSI
# CP123 D2: the DETERMINISTIC ($0, tokenless) RSI half runs ENABLED on a weekly cron (CP117's #1 lesson:
# written ≠ enabled). It refreshes tool-matrix versions, re-verifies brain pins, runs the eval pyramid,
# and PROPOSES drift to .rsi/proposal.json — it NEVER auto-commits (propose-only). The Claude half
# (brain-file rewrite + new golden task on a real watchlist delta) is deferred until CLAUDE_CODE_OAUTH_TOKEN
# is set per repo (chairman checklist, D8) — its absence is not a gap.
on:
  schedule:
    # Weekly, Monday 09:00 UTC (PLAN §14 Q13 / D13). UNCOMMENTED = live.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rsi-deterministic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install + build (so `parrot eval` is available to the loop)
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
      - name: Run the deterministic RSI loop (propose-only, never commits)
        run: node workflows/rsi.workflow.js --deterministic
      - name: Assert the loop did not modify tracked files (propose-only invariant)
        run: |
          set -e
          # The deterministic half writes only .rsi/ (gitignored). The tree MUST be clean — proves it proposes
          # without committing (the dsip snapback / CP117 "enabled ≠ auto-commit" guarantee).
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::RSI deterministic run modified tracked files — it must PROPOSE, not commit"
            git status --porcelain
            exit 1
          fi
          echo "propose-only invariant holds — working tree clean"
      - name: Open or update the proposal issue for a person to review
        if: always() && hashFiles('.rsi/proposal.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ -s .rsi/proposal.json ] || { echo "The proposal file is empty, so no issue."; exit 0; }
          jq -e '(.driftedPins | length) + (.brainPinGaps | length) > 0' .rsi/proposal.json > /dev/null \
            || { echo "The loop proposed nothing this run, so no issue."; exit 0; }
          gh label create proposal --color 2f5d8a --description "A change the self-improvement loop proposes for a person to review" --force
          {
            echo "Written by the scheduled self-improvement loop on $(date -u '+%Y-%m-%d %H:%M UTC'). It proposes; a person decides. The loop never merges."
            echo
            echo '````json'
            cat .rsi/proposal.json
            echo '````'
          } > "$RUNNER_TEMP/proposal-issue.md"
          number=$(gh issue list --label proposal --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/proposal-issue.md"
          else
            gh issue create --title "Parrot: proposal from the self-improvement loop" --label proposal --body-file "$RUNNER_TEMP/proposal-issue.md"
          fi

<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">The i18n/l10n employee — wire next-intl, find hardcoded strings, validate ICU</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">plurals + RTL + hreflang in CI. Plumbing, not copywriting.</text>
<text x="24" y="166" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  -v, --version               print parrot's version</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  -h, --help                  display help for command</text>
<text x="24" y="246" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">  init [options]              wire the i18n runtime into a (Next.js) app — 4</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">                              next-intl files, version-detected middleware</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">                              (proxy.ts on Next 16), setRequestLocale codegen,</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">                              await params, deliberate localePrefix [acceptance</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">                              step 1]</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">  extract [options]           scan source for hardcoded user-facing strings</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">                              (the catalog-bypass) + used-but-missing /</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">                              defined-but-unused keys; never builds keys</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">                              dynamically (O19) [acceptance step 2]</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">  check [options] [dir]       the CI correctness gate: key-completeness +</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">                              many-plural (pl/ar) + RTL + format +</text>
